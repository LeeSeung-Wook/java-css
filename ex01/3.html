<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .header {
        color: white;
        font-size: 20px;
        font-weight: 800;
        background-color: rgb(250, 169, 169);
        padding: 20px 0px 20px 0px; /* 12시 3시 6시 9시 */
        text-align: center; /* inline만 정렬가능 */
      }
      .menu > div {
        display: inline-block;
        height: 30px;
      }
      .menu {
        text-align: center; /* start center end */
        background-color: tomato;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="header">COS</div>
    <div class="menu">
      <div>HOME</div>
      <div>HTML</div>
      <div>CSS</div>
      <div>REACT</div>
      <div>DJANGO</div>
    </div>
  </body>
</html>
