<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main {
        background-color: rgb(241, 237, 237);
      }
      .section {
        display: grid;
        justify-content: center;
      }
      .title {
        font-size: 25px;
        font-weight: 700;
        color: rgb(250, 129, 115);
        text-align: center;
        margin-bottom: 10px;
      }
      .content {
        text-align: center;
        font-size: 14px;
      }
      .out_pic {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
      }
      .pictures {
        display: grid;
        background-image: url(./image.png);
        background-size: cover;
        justify-content: center;
        align-items: center;
        color: white;
        height: 150px;
        width: 150px;
        margin: 0px 10px;
      }
      .btn_box {
        display: grid;
        justify-content: center;
        margin-top: 40px;
      }
      .btn {
        color: white;
        background: linear-gradient(to bottom, #ec7a68, #c85546);
        border-radius: 4px;
        padding: 5px 15px;
        margin-bottom: 20px;
        font-weight: 600;
        border: none;
        box-shadow: 0px 0px 3px 1px rgb(160, 160, 160);
      }
    </style>
  </head>
  <body>
    <div>
      <main class="main">
        <section class="section">
          <div class="title">Meet Guidebooks</div>
          <div class="content">
            Discover hundreds of local spots recommended by Airbnb hosts
          </div>
          <div class="out_pic">
            <div class="pictures">London</div>
            <div class="pictures">London</div>
            <div class="pictures">London</div>
          </div>
          <div class="btn_box">
            <button class="btn">See All Guidebooks</button>
          </div>
        </section>
        <section class="section">
          <div class="title">Just for the weekend</div>
          <div class="content">
            Discover new, inspiring places close to home.
          </div>
          <div class="out_pic">
            <div class="pictures">London</div>
            <div class="pictures">London</div>
            <div class="pictures">London</div>
          </div>
          <div class="btn_box">
            <button class="btn">See All Destinations</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
