<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: #fafafc;
      }
      .title1 {
        font-size: 25px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      .foot {
        margin-top: 15px;
        display: grid;
        grid-template-columns: max-content max-content;
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .pic_box {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        margin-bottom: 50px;
        column-gap: 30px;
      }
      .pic1 {
        background-image: url(./meal1.png);
        background-size: 100% 100%;
        height: 100px;
        width: 200px;
        border-radius: 10px;
      }
      .pic2 {
        background-image: url(./meal2.png);
        background-size: 100% 100%;
        height: 100px;
        width: 200px;
        border-radius: 10px;
      }
      .pic3 {
        background-image: url(./meal3.png);
        background-size: 100% 100%;
        height: 100px;
        width: 200px;
        border-radius: 10px;
      }
      .pic4 {
        background-image: url(./meal4.png);
        background-size: 100% 100%;
        height: 100px;
        width: 200px;
        border-radius: 10px;
      }

      .card_box {
        display: grid;
        grid-template-columns: 60px 60px 60px 60px;
        column-gap: 10px;
        margin-bottom: 30px;
      }
      .circle_card {
        display: grid;

        justify-content: center;
      }
      .circle {
        width: 30px;
        height: 30px;
        display: grid;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        background-color: white;
        box-shadow: 0px 0px 3px 1px rgb(160, 160, 160);
      }
      .desc {
        text-align: center;
        font-size: 12px;
      }
      .sub_con {
        margin-top: 15px;
        font-weight: 700;
      }
      .foot button {
        color: red;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="title1">Add meals</div>
        <div class="card_box">
          <div class="circle_card">
            <div>
              <div class="circle">🥪</div>
            </div>
            <div class="desc">All</div>
          </div>
          <div class="circle_card">
            <div>
              <div class="circle">🍕</div>
            </div>
            <div class="desc">Pizza</div>
          </div>
          <div class="circle_card">
            <div>
              <div class="circle">🥩</div>
            </div>
            <div class="desc">Meat</div>
          </div>
          <div class="circle_card">
            <div>
              <div class="circle">🥗</div>
            </div>
            <div class="desc">Veggies</div>
          </div>
        </div>
        <div>
          <hr />
        </div>
        <div class="sub_con">Featured meals</div>
        <div class="pic_box">
          <div class="pic1"></div>
          <div class="pic2"></div>
          <div class="pic3"></div>
          <div class="pic4"></div>
        </div>
        <div>
          <hr />
        </div>
        <div class="foot">
          <div>Pasta Carbonara</div>
          <div><button>➕</button></div>
        </div>
        <div class="foot">
          <div>Lasagna</div>
          <div><button>➕</button></div>
        </div>
      </section>
    </main>
  </body>
</html>
